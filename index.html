<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSc Laboratory Technology | UCC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0a2e5c 0%, #1e4d8c 60%, #2a5ea8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Decorative background circles */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 199, 44, 0.08);
      pointer-events: none;
    }

    body::before {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
    }

    body::after {
      width: 400px;
      height: 400px;
      bottom: -150px;
      left: -150px;
      background: rgba(255, 255, 255, 0.04);
    }

    .landing {
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ffc72c;
      color: #0a2e5c;
      font-size: 48px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 10px 40px rgba(255, 199, 44, 0.4);
      letter-spacing: 1px;
    }

    .landing h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .landing .university {
      font-size: 15px;
      color: #c9dcf5;
      font-weight: 500;
      margin-bottom: 30px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #ffc72c;
      border-radius: 3px;
      margin: 0 auto 30px;
    }

    .welcome {
      font-size: 15px;
      color: #d9e6f7;
      line-height: 1.6;
      margin-bottom: 34px;
      padding: 0 10px;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffc72c;
      color: #0a2e5c;
      padding: 18px 40px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 24px rgba(255, 199, 44, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      max-width: 320px;
    }

    .enter-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 14px rgba(255, 199, 44, 0.3);
    }

    .enter-btn .arrow {
      font-size: 20px;
      transition: transform 0.2s;
    }

    .enter-btn:hover .arrow {
      transform: translateX(4px);
    }

    .footer-note {
      margin-top: 40px;
      font-size: 11px;
      color: #8fb2d9;
      letter-spacing: 0.5px;
    }

    .footer-note strong {
      color: #ffc72c;
    }
  </style>
</head>
<body>

  <div class="landing">
    <div class="logo-circle">LT</div>

    <h1>BSc Laboratory Technology</h1>
    <p class="university">University of Cape Coast</p>

    <div class="divider"></div>

    <p class="welcome">
      Welcome to the official student portal of the Department of Laboratory
      Technology. Access your courses, materials, handbook, elections, and
      more — all in one place.
    </p>

    <a class="enter-btn" href="home.html">
      ENTER PORTAL
      <span class="arrow">→</span>
    </a>

    <div class="footer-note">
      © 2026 <strong>BSc Laboratory Technology</strong> · UCC
    </div>
  </div>

</body>
</html>
