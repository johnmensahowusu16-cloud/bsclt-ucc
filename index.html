<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSc Laboratory Technology | UCC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      background: #0a1830;
      position: relative;
      overflow-x: hidden;
    }

    /* === ANIMATED BACKGROUND === */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.35), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(255, 199, 44, 0.18), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(30, 77, 140, 0.6), transparent 55%),
        linear-gradient(180deg, #071426 0%, #0a2040 50%, #061428 100%);
      z-index: -2;
    }

    /* Floating glow orbs */
    body::after {
      content: '';
      position: fixed;
      top: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 199, 44, 0.25), transparent 70%);
      filter: blur(40px);
      z-index: -1;
      animation: float 12s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, 40px); }
    }

    /* === HEADER === */
    header {
      text-align: center;
      padding: 30px 10px 25px;
      animation: fadeDown 0.7s ease-out;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd966, #ffc72c, #e6a800);
      color: #0a1830;
      font-size: 40px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      position: relative;
      box-shadow:
        0 8px 24px rgba(255, 199, 44, 0.5),
        inset 0 -4px 12px rgba(0, 0, 0, 0.15),
        inset 0 4px 12px rgba(255, 255, 255, 0.4);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow:
          0 8px 24px rgba(255, 199, 44, 0.5),
          inset 0 -4px 12px rgba(0, 0, 0, 0.15),
          inset 0 4px 12px rgba(255, 255, 255, 0.4);
      }
      50% {
        box-shadow:
          0 8px 40px rgba(255, 199, 44, 0.85),
          inset 0 -4px 12px rgba(0, 0, 0, 0.15),
          inset 0 4px 12px rgba(255, 255, 255, 0.4);
      }
    }

    header h1 {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff, #c9dcf5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 13px;
      color: #8fb2d9;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffc72c, transparent);
      margin: 20px auto;
      border-radius: 3px;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.7; transform: scaleX(1); }
      50% { opacity: 1; transform: scaleX(1.3); }
    }

    /* === MENU CARDS === */
    .menu {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 18px 20px;
      text-decoration: none;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeUp 0.6s ease-out backwards;
    }

    /* Stagger animations */
    .menu a:nth-child(1) { animation-delay: 0.1s; }
    .menu a:nth-child(2) { animation-delay: 0.15s; }
    .menu a:nth-child(3) { animation-delay: 0.2s; }
    .menu a:nth-child(4) { animation-delay: 0.25s; }
    .menu a:nth-child(5) { animation-delay: 0.3s; }
    .menu a:nth-child(6) { animation-delay: 0.35s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glowing left accent bar */
    .menu a::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #ffc72c, #ffd966);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .menu a:hover::before,
    .menu a:active::before {
      opacity: 1;
    }

    .menu a:hover,
    .menu a:active {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 199, 44, 0.5);
      box-shadow:
        0 8px 28px rgba(255, 199, 44, 0.25),
        0 0 0 1px rgba(255, 199, 44, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .menu .icon {
      font-size: 26px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .menu .label {
      flex: 1;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .menu .arrow {
      color: #ffc72c;
      font-size: 22px;
      font-weight: 300;
      transition: transform 0.3s;
    }

    .menu a:hover .arrow,
    .menu a:active .arrow {
      transform: translateX(4px);
    }

    /* === FOOTER === */
    footer {
      text-align: center;
      padding: 40px 20px 20px;
      font-size: 12px;
      color: #5a7ba8;
      line-height: 1.7;
      animation: fadeUp 0.8s ease-out 0.4s backwards;
    }

    footer .heart {
      color: #ffc72c;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-circle">LT</div>
    <h1>BSc Laboratory Technology</h1>
    <p>University of Cape Coast</p>
    <div class="divider"></div>
  </header>

  <nav class="menu">
    <a href="slides.html">
      <span class="icon">📚</span>
      <span class="label">Course Slides & Past Questions</span>
      <span class="arrow">›</span>
    </a>

    <a href="courses.html">
      <span class="icon">📅</span>
      <span class="label">Course Structure (4 Years)</span>
      <span class="arrow">›</span>
    </a>

    <a href="voting.html">
      <span class="icon">🗳️</span>
      <span class="label">Student Elections</span>
      <span class="arrow">›</span>
    </a>

    <a href="handbook.html">
      <span class="icon">📖</span>
      <span class="label">Student Handbook</span>
      <span class="arrow">›</span>
    </a>

    <a href="books.html">
      <span class="icon">📕</span>
      <span class="label">Book Library</span>
      <span class="arrow">›</span>
    </a>

    <a href="complaints.html">
      <span class="icon">📝</span>
      <span class="label">Submit a Complaint</span>
      <span class="arrow">›</span>
    </a>
  </nav>

  <footer>
    © 2026 BSc Laboratory Technology<br>
    University of Cape Coast<br>
    <span class="heart">♥</span> Built by students, for students
  </footer>

</body>
</html>
